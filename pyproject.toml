[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cbe"
version = "0.6.0"
description = "Pluggable coverage / extrapolation-detection middleware and benchmark library for machine learning interatomic potentials"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "ase",
]

[project.optional-dependencies]
soap = ["dscribe"]
index = ["faiss-cpu"]
latent = ["mace-torch"]
extract = ["ijson"]                 # streaming the MPtrj JSON corpus
all = ["dscribe", "faiss-cpu", "mace-torch", "ijson", "matplotlib", "pandas", "pyarrow"]

[project.urls]
Homepage = "https://github.com/<account>/cbe"
Issues = "https://github.com/<account>/cbe/issues"

[tool.setuptools.packages.find]
include = ["cbe*"]
